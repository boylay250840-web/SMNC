<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>SMNC Workforce</title>

<!-- PWA install metadata -->
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#146C43" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SMNC" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="icon" href="./icon-192.png" />

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Tailwind utility classes used by the app -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- In-browser JSX transform (no build step needed) -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<!-- Map bare specifiers used inside app.jsx to real modules -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.284.0?external=react",
    "firebase/app": "https://esm.sh/firebase@10.12.2/app",
    "firebase/firestore": "https://esm.sh/firebase@10.12.2/firestore"
  }
}
</script>

<style>
  html, body, #root { height: 100%; }
  body { margin: 0; background: #DCE3D8; overscroll-behavior: none; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module" data-presets="react" src="./app.jsx"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
